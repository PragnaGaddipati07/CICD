name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get the code
        uses: actions/checkout@v4
            - name: Show OIDC claims (debug)
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          part = token.split(".")[1]
          part += "=" * (-len(part) % 4)
          claims = json.loads(base64.urlsafe_b64decode(part))
          print({k: claims.get(k) for k in ("sub", "aud", "repository", "ref")})
          PY
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::861648135542:role/github-actions-ecr-push
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build the Docker image
        run: |
          IMAGE=861648135542.dkr.ecr.eu-west-1.amazonaws.com/cicd
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push the image to ECR
        if: github.event_name == 'push'
        run: |
          IMAGE=${{ steps.login-ecr.outputs.registry }}/cicd
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest