apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployink8s
spec:
 replicas: 2
 selector:
  matchLabels:
    app: pod1
 template:
  metadata:
   labels:
    app: pod1
  spec:
   containers:
    - name: cicd
      image: ghcr.io/pragnagaddipati07/cicd:latest
      imagePullPolicy: IfNotPresent
      ports:
       - containerPort: 8000
